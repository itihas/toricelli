[package]
name = "toricelli"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
diesel = "2.2.9"
lexpr = "0.2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite = {version = "0.37.0", features = ["default"]}
sprs = "0.11"
